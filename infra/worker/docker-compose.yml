# FadeUp Prospect Worker V2 — worker container.
#
# Usage:
#   Start:   docker compose -f infra/worker/docker-compose.yml up -d --build
#   Logs:    docker compose -f infra/worker/docker-compose.yml logs -f
#   Stop:    docker compose -f infra/worker/docker-compose.yml down
#
# Joins the EXISTING fadeup-supabase_default network (created by
# infra/supabase/docker-compose.yml, project name "fadeup-supabase") as an
# external network — this compose file does not own or manage that
# network, and never touches Jasmean OS networks/containers.
#
# Requires infra/worker/.env.worker (gitignored — see .env.worker.example)
# and the prospect_worker DB role's password already set via
# infra/worker/bootstrap-worker-db.sh.

name: fadeup-prospect-worker

services:
  prospect-worker-v2:
    container_name: fadeup-prospect-worker-v2
    build:
      context: ../../apps/prospect-worker-v2
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.worker
    networks:
      - fadeup-supabase_default
    volumes:
      # ML model artifacts, produced by ml/train.py and read by inference.
      # A named volume so they survive image rebuilds; never baked into the
      # image and never committed.
      - fadeup-worker-ml-artifacts:/app/ml-artifacts
    # No published port by default: the Worker is outbound-only (Postgres,
    # provider APIs) unless WEBHOOK_HTTP_ENABLED=true, in which case the
    # WhatsApp webhook listener binds on WEBHOOK_HTTP_PORT INSIDE this
    # network. Publish it to the host only via the existing Nginx TLS
    # terminator — never expose the container port directly.
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fadeup-worker-ml-artifacts:
    name: fadeup-worker-ml-artifacts

networks:
  fadeup-supabase_default:
    external: true
