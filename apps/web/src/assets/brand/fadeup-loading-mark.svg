<!--
  The FadeUp LOADING mark — the same canonical geometry as fadeup-mark.svg
  (source of truth: src/components/brand/fadeup-mark.tsx), carrying its own
  animation: the three real segments (stem, top arm, mid arm) arrive in
  sequence on a ~1s cycle. No spinner, no progress, no second logo — the
  brand mark, breathing.
  Reduced motion: the media query inside this file replaces the sequence
  with a static mark and a subtle opacity breath, wherever the asset is
  embedded (works inside <img>).
  Light direction only: intended on white/near-white canvases.
-->
<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fu-seg { animation: fu-seg 1000ms cubic-bezier(0.22, 0.61, 0.28, 1) infinite; }
    .fu-s2 { animation-delay: 140ms; }
    .fu-s3 { animation-delay: 280ms; }
    @keyframes fu-seg {
      0% { opacity: 0.25; transform: translateY(3px); }
      28%, 72% { opacity: 1; transform: none; }
      100% { opacity: 0.25; transform: translateY(3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fu-seg { animation: fu-breathe 1600ms ease-in-out infinite; transform: none; }
      @keyframes fu-breathe {
        0%, 100% { opacity: 0.82; }
        50% { opacity: 1; }
      }
    }
  </style>
  <defs>
    <linearGradient id="fu-grad-l" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17A36A"/>
      <stop offset="1" stop-color="#3DDAA2"/>
    </linearGradient>
  </defs>
  <path class="fu-seg" d="M8 12a6 6 0 0 1 6-6h6v36a6 6 0 0 1-12 0V12Z" fill="url(#fu-grad-l)"/>
  <path class="fu-seg fu-s2" d="M20 6h14c5 0 8 2.4 8 6s-3 6-8 6H20V6Z" fill="url(#fu-grad-l)"/>
  <path class="fu-seg fu-s3" d="M20 21h9c4.4 0 7 2.2 7 5.5S33.4 32 29 32h-9V21Z" fill="url(#fu-grad-l)" opacity="0.86"/>
</svg>
