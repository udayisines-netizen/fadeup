<!--
  The FadeUp LOADING lockup — the animated mark (same canonical geometry,
  same animation as fadeup-loading-mark.svg) with the dark wordmark beneath,
  for surfaces that embed one self-contained asset (e.g. a PWA splash).
  In-app, V2Splash composes the mark asset with HTML text instead, so the
  wordmark stays crisp and localizable.
-->
<svg viewBox="0 0 120 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fu-seg { animation: fu-seg 1000ms cubic-bezier(0.22, 0.61, 0.28, 1) infinite; }
    .fu-s2 { animation-delay: 140ms; }
    .fu-s3 { animation-delay: 280ms; }
    @keyframes fu-seg {
      0% { opacity: 0.25; transform: translateY(3px); }
      28%, 72% { opacity: 1; transform: none; }
      100% { opacity: 0.25; transform: translateY(3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fu-seg { animation: fu-breathe 1600ms ease-in-out infinite; transform: none; }
      @keyframes fu-breathe {
        0%, 100% { opacity: 0.82; }
        50% { opacity: 1; }
      }
    }
  </style>
  <defs>
    <linearGradient id="fu-grad-k" x1="42" y1="54" x2="78" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17A36A"/>
      <stop offset="1" stop-color="#3DDAA2"/>
    </linearGradient>
  </defs>
  <g transform="translate(36 12)">
    <path class="fu-seg" d="M8 12a6 6 0 0 1 6-6h6v36a6 6 0 0 1-12 0V12Z" fill="url(#fu-grad-k)"/>
    <path class="fu-seg fu-s2" d="M20 6h14c5 0 8 2.4 8 6s-3 6-8 6H20V6Z" fill="url(#fu-grad-k)"/>
    <path class="fu-seg fu-s3" d="M20 21h9c4.4 0 7 2.2 7 5.5S33.4 32 29 32h-9V21Z" fill="url(#fu-grad-k)" opacity="0.86"/>
  </g>
  <text x="60" y="84" text-anchor="middle" fill="#101512"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif"
    font-size="15" font-weight="650" letter-spacing="-0.15">FadeUp</text>
</svg>
