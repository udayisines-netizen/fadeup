# FadeUp web — nginx config for the production container.
#
# Lives beside the app (not in infra/) because it is part of how this app is
# served, and because the Dockerfile's build context is apps/web.
#
# Deliberately minimal. TLS, HSTS and the public hostname are terminated by
# the HOST nginx in front of this container; duplicating them here would mean
# two places to change a certificate. This container's only jobs are: serve
# the built SPA, get the caching right, and never 404 a client-side route.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind the host nginx, so the useful client address is the forwarded
    # one. Logging the proxy's own IP for every request is useless.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # These are cheap, do not depend on the host proxy also setting them, and
    # cost nothing if it does (identical values are not duplicated).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Never cached: it is the document that names the current hashed asset
    # bundle. Caching it is how a deploy silently keeps serving the old app.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Pre-existing endpoint, kept so anything already pointed at it (an
    # uptime check, a load balancer) keeps working. /healthz is generated by
    # the Dockerfile and is what the container healthcheck uses;
    # public/health.json is a repository file. Both are fine to serve.
    location = /health.json {
        access_log off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Content-hashed by Vite, so the filename changes whenever the bytes do.
    # Safe to cache for a year and immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Crawler-facing files must stay fresh enough to fix without a cache bust.
    location = /robots.txt   { add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
    location = /sitemap.xml  { add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }

    # The SPA fallback. Every client-side route — /search, /s/{slug}/profile,
    # /app/customer/passport, /auth/callback — is served by index.html so a
    # deep link, a refresh, or an OAuth provider redirecting straight to
    # /auth/callback all work rather than 404ing at the edge. That last case
    # is not hypothetical: without this, Google and Apple sign-in would fail
    # at the final hop on a hard navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
