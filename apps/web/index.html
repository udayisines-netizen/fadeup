<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Theme + locale bootstrap — runs synchronously, before first paint, so
      there is no flash of the wrong theme/language while React and i18next
      load. Mirrors src/lib/theme.ts (getStoredTheme/resolveTheme) and
      src/lib/locale.ts (resolveInitialLocale) — keep both in sync with any
      change here, since this copy cannot import those modules directly.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('fadeup-theme')
          var resolved =
            theme === 'light' || theme === 'dark'
              ? theme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', resolved)
        } catch (e) {}
        try {
          var SUPPORTED = ['en', 'fr', 'es', 'de', 'it', 'pt', 'ar', 'zh-CN', 'ja', 'ru']
          var RTL = ['ar']
          function normalize(value) {
            if (!value) return null
            for (var i = 0; i < SUPPORTED.length; i++) {
              if (SUPPORTED[i].toLowerCase() === String(value).toLowerCase()) return SUPPORTED[i]
            }
            return null
          }
          var locale = normalize(localStorage.getItem('fadeup-locale-explicit')) || normalize(localStorage.getItem('fadeup-locale-detected'))
          if (!locale) {
            var langs = navigator.languages || [navigator.language]
            for (var j = 0; j < langs.length; j++) {
              var lang = langs[j]
              if (!lang) continue
              if (lang.toLowerCase().indexOf('zh') === 0) {
                locale = 'zh-CN'
                break
              }
              var match = normalize(lang.split('-')[0])
              if (match) {
                locale = match
                break
              }
            }
          }
          locale = locale || 'en'
          document.documentElement.setAttribute('lang', locale)
          document.documentElement.setAttribute('dir', RTL.indexOf(locale) !== -1 ? 'rtl' : 'ltr')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FadeUp — the operating system for modern barbershops</title>
    <meta
      name="description"
      content="FadeUp connects booking, live queue, walk-ins, Chair Mode, Barber Passport, customer relationships, memberships and multi-location reporting for barbershops in one system."
    />

    <!--
      These are static base tags — the only thing a non-JS-executing crawler
      or social-media link unfurler (Slack, iMessage, X/Twitter, etc.) will
      ever see, since this is a client-rendered SPA with no SSR/prerendering.
      `src/lib/use-document-meta.ts` updates `document.title` and the
      description per route at runtime for JS-executing crawlers and the
      browser tab/history — but it can never change what an unfurler reads
      here, because unfurlers don't execute JavaScript. See
      docs/architecture.md ("SEO" section) for what this does and doesn't
      achieve. Domain below is a placeholder (RFC 2606 `.example`) until
      FadeUp has a real production domain wired through Nginx/TLS.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FadeUp" />
    <meta property="og:title" content="FadeUp — the operating system for modern barbershops" />
    <meta
      property="og:description"
      content="Booking, live queue, walk-ins, Chair Mode, Barber Passport, customer relationships, memberships and multi-location reporting — in one connected system."
    />
    <meta property="og:url" content="https://www.fadeup.example/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FadeUp — the operating system for modern barbershops" />
    <meta
      name="twitter:description"
      content="Booking, live queue, walk-ins, Chair Mode, Barber Passport, customer relationships, memberships and multi-location reporting — in one connected system."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
